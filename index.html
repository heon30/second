<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090b18" />
  <title>한밤의 늑대인간 온라인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
:root {
  color-scheme: dark;
  --bg: #070914;
  --panel: rgba(20, 24, 48, 0.92);
  --panel-2: rgba(31, 37, 70, 0.86);
  --line: rgba(255, 255, 255, 0.12);
  --text: #f7f7ff;
  --muted: #afb5d4;
  --accent: #9a8cff;
  --accent-2: #66d9ff;
  --danger: #ff6f82;
  --success: #67e1a0;
  --warning: #ffd36e;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
  font-family: "Noto Sans KR", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 50% -20%, rgba(104, 89, 212, 0.34), transparent 42%),
    radial-gradient(circle at 110% 30%, rgba(29, 131, 178, 0.20), transparent 34%),
    linear-gradient(180deg, #090b19 0%, #05060e 100%);
  color: var(--text);
  overflow-x: hidden;
}

button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.stars,
.stars::before,
.stars::after {
  position: fixed;
  inset: 0;
  content: "";
  pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.72) 0 1px, transparent 1.4px),
    radial-gradient(circle, rgba(142,198,255,.55) 0 1px, transparent 1.5px);
  background-size: 73px 73px, 121px 121px;
  background-position: 7px 11px, 43px 29px;
  opacity: .35;
}
.stars::before { transform: scale(1.35); opacity: .22; }
.stars::after { transform: scale(.72); opacity: .30; }

.app-shell {
  width: min(760px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: 24px 16px calc(36px + env(safe-area-inset-bottom));
  position: relative;
  z-index: 1;
}

.card,
.loading-card {
  background: linear-gradient(145deg, rgba(28, 33, 65, .95), rgba(13, 16, 35, .96));
  border: 1px solid var(--line);
  border-radius: 26px;
  box-shadow: var(--shadow);
  padding: 24px;
  backdrop-filter: blur(18px);
}
.loading-card { text-align: center; margin-top: 15vh; }
.moon { font-size: 58px; filter: drop-shadow(0 0 22px rgba(255,228,138,.35)); }

h1, h2, h3, p { margin-top: 0; }
h1 { font-size: clamp(30px, 7vw, 46px); margin-bottom: 8px; letter-spacing: -1.5px; }
h2 { font-size: 25px; margin-bottom: 10px; }
h3 { font-size: 18px; margin-bottom: 10px; }
p { color: var(--muted); line-height: 1.65; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; }
.brand-mark { font-size: 28px; }
.room-chip {
  border: 1px solid rgba(154,140,255,.42);
  background: rgba(154,140,255,.12);
  border-radius: 999px;
  padding: 8px 13px;
  font-weight: 800;
  letter-spacing: 1.5px;
}

.hero { text-align: center; padding: 26px 22px; }
.hero .moon { margin-bottom: 8px; }
.hero-sub { margin-bottom: 22px; }

.form-grid { display: grid; gap: 12px; }
.field { display: grid; gap: 7px; text-align: left; }
.field label { color: #d9dcf0; font-weight: 700; font-size: 14px; }
input {
  width: 100%;
  border: 1px solid var(--line);
  background: rgba(5, 7, 17, .7);
  color: var(--text);
  border-radius: 15px;
  padding: 14px 15px;
  outline: none;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(154,140,255,.14); }
input.room-input { text-transform: uppercase; letter-spacing: 5px; text-align: center; font-weight: 900; font-size: 22px; }

.button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  border: 0;
  border-radius: 15px;
  min-height: 50px;
  padding: 12px 16px;
  font-weight: 900;
  cursor: pointer;
  color: #0c1022;
  background: linear-gradient(135deg, var(--accent), #c2baff);
  box-shadow: 0 10px 25px rgba(105, 89, 216, .28);
  transition: transform .15s ease, opacity .15s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .38; cursor: not-allowed; filter: grayscale(.25); }
.btn.secondary { color: var(--text); background: rgba(255,255,255,.08); border: 1px solid var(--line); box-shadow: none; }
.btn.danger { color: white; background: linear-gradient(135deg, #d94761, var(--danger)); }
.btn.success { color: #062316; background: linear-gradient(135deg, #4ecf8a, #8af0bb); }
.btn.full { width: 100%; }
.btn.small { min-height: 39px; padding: 8px 12px; border-radius: 12px; font-size: 13px; }

.section { margin-top: 14px; }
.status-banner {
  border: 1px solid rgba(102,217,255,.25);
  background: linear-gradient(135deg, rgba(102,217,255,.12), rgba(154,140,255,.12));
  border-radius: 18px;
  padding: 15px;
  margin-bottom: 14px;
  text-align: center;
}
.status-banner strong { display: block; font-size: 20px; margin-bottom: 4px; }

.player-list { display: grid; gap: 9px; }
.player-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 15px;
  padding: 12px 14px;
}
.player-name { font-weight: 800; }
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 900;
  background: rgba(255,255,255,.09);
  color: #dce0f7;
}
.badge.host { background: rgba(255,211,110,.15); color: var(--warning); }
.badge.done { background: rgba(103,225,160,.14); color: var(--success); }
.badge.wait { background: rgba(255,111,130,.12); color: #ff9cab; }

.role-card {
  position: relative;
  overflow: hidden;
  min-height: 210px;
  display: grid;
  place-items: center;
  text-align: center;
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,.13);
  background:
    radial-gradient(circle at 50% 0%, rgba(154,140,255,.30), transparent 42%),
    linear-gradient(145deg, rgba(39, 44, 84, .96), rgba(13, 16, 35, .98));
  padding: 24px;
  margin-bottom: 14px;
}
.role-icon { font-size: 60px; margin-bottom: 8px; }
.role-name { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
.role-description { color: var(--muted); line-height: 1.6; max-width: 500px; }
.role-hidden { cursor: pointer; }
.role-hidden .role-icon { filter: grayscale(1); opacity: .85; }

.option-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.option-grid.three { grid-template-columns: repeat(3, 1fr); }
.option {
  min-height: 74px;
  border-radius: 15px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.055);
  color: var(--text);
  padding: 12px 10px;
  cursor: pointer;
  font-weight: 800;
}
.option.selected { border-color: var(--accent); background: rgba(154,140,255,.20); box-shadow: inset 0 0 0 1px rgba(154,140,255,.35); }
.option:disabled { opacity: .42; cursor: not-allowed; }

.action-box {
  border: 1px solid rgba(255,255,255,.10);
  background: rgba(5,7,17,.45);
  border-radius: 20px;
  padding: 18px;
  margin-top: 14px;
}
.action-box h3 { margin-bottom: 7px; }
.action-result {
  border-left: 4px solid var(--accent-2);
  background: rgba(102,217,255,.08);
  border-radius: 12px;
  padding: 14px;
  margin-top: 12px;
}
.action-result p { margin: 0; color: #e8ebff; }

.tab-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.tab {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.05);
  color: var(--muted);
  border-radius: 12px;
  padding: 10px;
  font-weight: 800;
  cursor: pointer;
}
.tab.active { color: var(--text); border-color: var(--accent); background: rgba(154,140,255,.16); }

.host-panel {
  margin-top: 14px;
  padding: 16px;
  border: 1px solid rgba(255,211,110,.22);
  background: rgba(255,211,110,.07);
  border-radius: 18px;
}
.progress-line { height: 9px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; margin: 10px 0 12px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: inherit; }

.vote-table { display: grid; gap: 9px; }
.vote-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  border-radius: 14px;
  background: rgba(255,255,255,.055);
  padding: 12px 14px;
}
.vote-count { font-size: 18px; font-weight: 900; }
.eliminated { border-color: rgba(255,111,130,.48); background: rgba(255,111,130,.10); }

.team-result {
  display: grid;
  gap: 10px;
  margin: 14px 0;
}
.team-chip {
  border-radius: 16px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.055);
  padding: 14px;
  font-weight: 900;
  text-align: center;
}
.team-chip.win { border-color: rgba(103,225,160,.38); background: rgba(103,225,160,.12); color: #a8f4ca; }
.team-chip.lose { opacity: .55; }

.reveal-grid { display: grid; gap: 10px; }
.reveal-item {
  border-radius: 16px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.05);
  padding: 14px;
}
.reveal-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 8px; }
.role-change { color: var(--muted); }
.role-change strong { color: var(--text); }
.winner-mark { color: var(--success); font-weight: 900; }

.center-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.center-card { text-align: center; padding: 12px 6px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
.center-card .mini-icon { font-size: 28px; }
.center-card .mini-name { font-size: 12px; font-weight: 900; margin-top: 4px; }

.muted { color: var(--muted); }
.center { text-align: center; }
.spacer { height: 10px; }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.warning-text { color: var(--warning); }
.error-text { color: #ff9cab; }
.success-text { color: var(--success); }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(22px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  z-index: 50;
  background: rgba(10, 12, 25, .95);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 13px;
  padding: 11px 16px;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transition: .22s ease;
  max-width: calc(100vw - 32px);
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.chat-card { padding: 18px; }
.chat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.chat-head h3 { margin: 0; }
.chat-messages {
  height: min(38vh, 340px);
  min-height: 190px;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 12px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 17px;
  background: rgba(4, 6, 15, .48);
  scrollbar-width: thin;
}
.chat-empty {
  margin: auto;
  text-align: center;
  color: var(--muted);
  line-height: 1.6;
}
.chat-message {
  align-self: flex-start;
  width: min(88%, 520px);
}
.chat-message.mine { align-self: flex-end; }
.chat-message-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 5px 4px;
  color: var(--muted);
  font-size: 11px;
}
.chat-message.mine .chat-message-head { justify-content: flex-end; }
.chat-bubble {
  padding: 10px 12px;
  border-radius: 15px 15px 15px 5px;
  background: rgba(255,255,255,.085);
  border: 1px solid rgba(255,255,255,.08);
  color: #f5f6ff;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.chat-message.mine .chat-bubble {
  border-radius: 15px 15px 5px 15px;
  background: linear-gradient(135deg, rgba(154,140,255,.30), rgba(102,217,255,.18));
  border-color: rgba(154,140,255,.34);
}
.chat-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  margin-top: 10px;
}
.chat-form input { min-width: 0; }
.chat-send { min-width: 74px; }
.chat-notice {
  margin: 8px 2px 0;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
.chat-locked { color: var(--warning); }

@media (max-width: 520px) {
  .app-shell { padding: 14px 10px 30px; }
  .card { padding: 18px; border-radius: 22px; }
  .button-row { grid-template-columns: 1fr; }
  .option-grid.three { grid-template-columns: 1fr; }
  .center-cards { grid-template-columns: repeat(3, 1fr); }
  h1 { font-size: 32px; }
}

  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main id="app" class="app-shell">
    <section class="loading-card">
      <div class="moon">🌕</div>
      <h1>한밤의 늑대인간</h1>
      <p>게임 서버에 연결하고 있습니다.</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>
    <section style="max-width:560px;margin:80px auto;padding:24px;background:#171a2e;color:white;border-radius:20px;text-align:center">
      이 게임을 실행하려면 브라우저의 JavaScript를 허용해야 합니다.
    </section>
  </noscript>

    window.addEventListener('error', function (event) {
      console.error('게임 시작 오류:', event.error || event.message);
    });
    window.addEventListener('unhandledrejection', function (event) {
      console.error('게임 비동기 오류:', event.reason);
    });
    window.setTimeout(function () {
      if (window.__ONW_MODULE_LOADED__) return;
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = `
        <section class="card center" style="margin-top:12vh">
          <div class="role-icon">⚠️</div>
          <h2>게임 파일을 불러오지 못했습니다</h2>
          <p>인터넷 연결을 확인한 뒤 새로고침해 주세요.</p>
          <p class="muted">학교·기관 네트워크에서 Firebase 또는 gstatic 접속이 차단된 경우에도 이 화면이 나타날 수 있습니다.</p>
          <button class="btn full" onclick="location.reload()">다시 시도</button>
        </section>`;
    }, 8000);
  </script>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signInAnonymously,
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import {
  collection,
  deleteDoc,
  doc,
  getDoc,
  getDocs,
  getFirestore,
  limit,
  onSnapshot,
  orderBy,
  query,
  runTransaction,
  serverTimestamp,
  setDoc,
  updateDoc,
  writeBatch,
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

window.__ONW_MODULE_LOADED__ = true;

const firebaseConfig = {
  apiKey: "AIzaSyBst4rfRAPutbrbzyTNziHo3FpXBTMGFxY",
  authDomain: "wolf-bb13c.firebaseapp.com",
  projectId: "wolf-bb13c",
  storageBucket: "wolf-bb13c.firebasestorage.app",
  messagingSenderId: "99437231073",
  appId: "1:99437231073:web:01a6e3bc498959916bf0a0",
  measurementId: "G-MKBGY2HZJ9",
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const appEl = document.querySelector("#app");
const toastEl = document.querySelector("#toast");

const ROLE_INFO = {
  werewolf: {
    name: "늑대인간",
    icon: "🐺",
    team: "wolf",
    description: "다른 늑대인간을 확인합니다. 혼자라면 중앙 카드 한 장을 확인할 수 있습니다.",
  },
  seer: {
    name: "예언자",
    icon: "🔮",
    team: "village",
    description: "다른 사람의 카드 한 장 또는 중앙 카드 두 장을 확인합니다.",
  },
  robber: {
    name: "강도",
    icon: "🥷",
    team: "village",
    description: "다른 사람과 카드를 바꾼 뒤 새로 받은 카드를 확인합니다.",
  },
  troublemaker: {
    name: "말썽쟁이",
    icon: "🎭",
    team: "village",
    description: "다른 두 사람의 카드를 서로 바꾸지만 카드 내용은 보지 못합니다.",
  },
  tanner: {
    name: "무두장이",
    icon: "🧵",
    team: "tanner",
    description: "투표로 자신이 죽으면 승리합니다.",
  },
  freemason: {
    name: "프리메이슨",
    icon: "🤝",
    team: "village",
    description: "다른 프리메이슨을 확인합니다.",
  },
  villager: {
    name: "마을주민",
    icon: "🏠",
    team: "village",
    description: "밤에는 특별한 행동을 하지 않습니다.",
  },
};

const NIGHT_ORDER = ["werewolf", "seer", "robber", "troublemaker", "freemason"];
const ROOM_CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let currentUser = null;
let roomCode = null;
let roomData = null;
let players = [];
let myPrivate = null;
let myVote = null;
let hostPrivates = [];
let hostVotes = [];
let publicResult = null;
let revealedResult = null;
let chatMessages = [];
let chatError = "";
let chatSending = false;
let lastChatSentAt = 0;
let lastRenderedChatId = null;
let subscriptions = [];
let hostSubscriptions = [];
let hostListenersActive = false;
let processingActions = new Set();
let roleVisible = false;
let actionSubmitting = false;
let uiState = {
  seerMode: "player",
  selectedPlayers: [],
  selectedCenters: [],
  voteTarget: null,
  chatDraft: "",
};

function roleInfo(role) {
  return ROLE_INFO[role] ?? { name: role ?? "알 수 없음", icon: "❓", team: "", description: "" };
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toastEl.classList.remove("show"), 2600);
}

function formatChatTime(timestamp) {
  const date = timestamp?.toDate?.();
  if (!date || Number.isNaN(date.getTime())) return "방금";
  return new Intl.DateTimeFormat("ko-KR", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false,
  }).format(date);
}

function isChatLocked() {
  return roomData?.status === "night";
}

function formatError(error) {
  console.error(error);
  const code = error?.code ?? "";
  if (code.includes("permission-denied")) return "Firebase 권한이 없습니다. Firestore 규칙을 확인해 주세요.";
  if (code.includes("unavailable")) return "네트워크 연결이 불안정합니다. 잠시 후 다시 시도해 주세요.";
  if (code.includes("auth/operation-not-allowed")) return "Firebase Authentication에서 익명 로그인을 활성화해 주세요.";
  return error?.message || "처리 중 오류가 발생했습니다.";
}

function resetUiState() {
  roleVisible = false;
  actionSubmitting = false;
  uiState = {
    seerMode: "player",
    selectedPlayers: [],
    selectedCenters: [],
    voteTarget: null,
    chatDraft: "",
  };
}

function cleanupSubscriptions() {
  subscriptions.forEach((unsub) => unsub?.());
  hostSubscriptions.forEach((unsub) => unsub?.());
  subscriptions = [];
  hostSubscriptions = [];
  hostListenersActive = false;
}

function isHost() {
  return Boolean(currentUser && roomData?.hostUid === currentUser.uid);
}

function getPlayer(uid) {
  return players.find((player) => player.uid === uid);
}

function playerName(uid) {
  return getPlayer(uid)?.nickname ?? "알 수 없는 참가자";
}

function sortedPlayers(list = players) {
  return [...list].sort((a, b) => {
    const aTime = a.joinedAt?.seconds ?? Number.MAX_SAFE_INTEGER;
    const bTime = b.joinedAt?.seconds ?? Number.MAX_SAFE_INTEGER;
    if (aTime !== bTime) return aTime - bTime;
    return a.nickname.localeCompare(b.nickname, "ko");
  });
}

function createRoomCode() {
  const bytes = new Uint32Array(4);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (value) => ROOM_CODE_CHARS[value % ROOM_CODE_CHARS.length]).join("");
}

function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i -= 1) {
    const random = new Uint32Array(1);
    crypto.getRandomValues(random);
    const j = random[0] % (i + 1);
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function deckForPlayerCount(count) {
  const common = ["werewolf", "werewolf", "seer", "robber", "troublemaker", "tanner"];
  const configs = {
    3: [...common],
    4: [...common, "villager"],
    5: [...common, "villager", "villager"],
    6: [...common, "villager", "freemason", "freemason"],
    7: [...common, "villager", "villager", "freemason", "freemason"],
    8: [...common, "freemason", "freemason", "villager", "villager", "villager"],
    9: [...common, "freemason", "freemason", "villager", "villager", "villager", "villager"],
  };
  return configs[count] ?? null;
}

function roomRef(code = roomCode) {
  return doc(db, "rooms", code);
}

function subRef(subcollection, id, code = roomCode) {
  return doc(db, "rooms", code, subcollection, id);
}

function subCollection(subcollection, code = roomCode) {
  return collection(db, "rooms", code, subcollection);
}

async function deleteSubcollection(name, code = roomCode) {
  const snapshot = await getDocs(subCollection(name, code));
  if (snapshot.empty) return;
  const batch = writeBatch(db);
  snapshot.docs.forEach((snapshotDoc) => batch.delete(snapshotDoc.ref));
  await batch.commit();
}

async function ensureSignedIn() {
  if (auth.currentUser) return auth.currentUser;
  const credential = await signInAnonymously(auth);
  return credential.user;
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    try {
      await signInAnonymously(auth);
    } catch (error) {
      appEl.innerHTML = errorCard(formatError(error));
    }
    return;
  }

  currentUser = user;
  const savedCode = localStorage.getItem("onw_room_code");
  if (savedCode) {
    try {
      const ownPlayer = await getDoc(subRef("players", user.uid, savedCode));
      const savedRoom = await getDoc(roomRef(savedCode));
      if (ownPlayer.exists() && savedRoom.exists()) {
        roomCode = savedCode;
        subscribeToRoom(savedCode);
        return;
      }
    } catch (error) {
      console.warn("기존 방 복구 실패", error);
    }
  }
  render();
});

function errorCard(message) {
  return `
    <section class="card center" style="margin-top:15vh">
      <div class="role-icon">⚠️</div>
      <h2>연결할 수 없습니다</h2>
      <p>${escapeHtml(message)}</p>
      <button class="btn full" onclick="location.reload()">다시 시도</button>
    </section>
  `;
}

async function createRoom(nickname) {
  if (!currentUser) await ensureSignedIn();
  const cleanNickname = nickname.trim().slice(0, 12);
  if (cleanNickname.length < 1) throw new Error("닉네임을 입력해 주세요.");

  let code = "";
  for (let attempt = 0; attempt < 8; attempt += 1) {
    const candidate = createRoomCode();
    const existing = await getDoc(roomRef(candidate));
    if (!existing.exists()) {
      code = candidate;
      break;
    }
  }
  if (!code) throw new Error("방 코드를 만들지 못했습니다. 다시 시도해 주세요.");

  await setDoc(roomRef(code), {
    hostUid: currentUser.uid,
    status: "lobby",
    nightIndex: null,
    nightRole: null,
    gameNumber: 0,
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp(),
  });

  await setDoc(subRef("players", currentUser.uid, code), {
    uid: currentUser.uid,
    nickname: cleanNickname,
    isHost: true,
    joinedAt: serverTimestamp(),
  });

  roomCode = code;
  localStorage.setItem("onw_room_code", code);
  localStorage.setItem("onw_nickname", cleanNickname);
  subscribeToRoom(code);
  showToast(`방 ${code}가 만들어졌습니다.`);
}

async function joinRoom(codeInput, nickname) {
  if (!currentUser) await ensureSignedIn();
  const code = codeInput.trim().toUpperCase();
  const cleanNickname = nickname.trim().slice(0, 12);
  if (!/^[A-Z2-9]{4}$/.test(code)) throw new Error("4자리 방 코드를 정확히 입력해 주세요.");
  if (!cleanNickname) throw new Error("닉네임을 입력해 주세요.");

  const targetRoom = await getDoc(roomRef(code));
  if (!targetRoom.exists()) throw new Error("존재하지 않는 방입니다.");

  const ownPlayerRef = subRef("players", currentUser.uid, code);
  const ownPlayer = await getDoc(ownPlayerRef);
  const playerSnapshot = await getDocs(subCollection("players", code));

  if (!ownPlayer.exists()) {
    if (targetRoom.data().status !== "lobby") throw new Error("이미 게임이 시작되어 새로 입장할 수 없습니다.");
    if (playerSnapshot.size >= 9) throw new Error("이 방은 이미 9명으로 가득 찼습니다.");
    const duplicate = playerSnapshot.docs.some(
      (item) => item.data().nickname?.trim().toLowerCase() === cleanNickname.toLowerCase(),
    );
    if (duplicate) throw new Error("같은 닉네임을 사용 중인 참가자가 있습니다.");
  }

  await setDoc(
    ownPlayerRef,
    {
      uid: currentUser.uid,
      nickname: cleanNickname,
      isHost: targetRoom.data().hostUid === currentUser.uid,
      joinedAt: ownPlayer.exists() ? ownPlayer.data().joinedAt : serverTimestamp(),
    },
    { merge: true },
  );

  roomCode = code;
  localStorage.setItem("onw_room_code", code);
  localStorage.setItem("onw_nickname", cleanNickname);
  subscribeToRoom(code);
  showToast(`방 ${code}에 입장했습니다.`);
}

async function leaveRoom() {
  if (!currentUser || !roomCode) return;
  if (isHost() && players.length > 1) {
    throw new Error("방장은 다른 참가자가 있는 동안 나갈 수 없습니다. 새 방을 만들어 진행해 주세요.");
  }

  const code = roomCode;
  await deleteDoc(subRef("players", currentUser.uid, code));
  if (isHost()) {
    await deleteSubcollection("messages", code);
    await deleteDoc(roomRef(code));
  }
  cleanupSubscriptions();
  roomCode = null;
  roomData = null;
  players = [];
  myPrivate = null;
  myVote = null;
  publicResult = null;
  revealedResult = null;
  chatMessages = [];
  chatError = "";
  lastRenderedChatId = null;
  localStorage.removeItem("onw_room_code");
  resetUiState();
  render();
}

function subscribeToRoom(code) {
  cleanupSubscriptions();
  resetUiState();
  chatMessages = [];
  chatError = "";
  lastRenderedChatId = null;

  subscriptions.push(
    onSnapshot(roomRef(code), (snapshot) => {
      if (!snapshot.exists()) {
        showToast("방이 종료되었습니다.");
        cleanupSubscriptions();
        roomCode = null;
        roomData = null;
        localStorage.removeItem("onw_room_code");
        render();
        return;
      }

      const previousStep = `${roomData?.status ?? ""}:${roomData?.nightRole ?? ""}`;
      roomData = { id: snapshot.id, ...snapshot.data() };
      const currentStep = `${roomData.status}:${roomData.nightRole ?? ""}`;
      if (previousStep && previousStep !== currentStep) resetUiState();
      ensureHostListeners();
      render();
    }, (error) => showToast(formatError(error))),
  );

  subscriptions.push(
    onSnapshot(query(subCollection("players", code), orderBy("joinedAt", "asc")), (snapshot) => {
      players = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
      render();
    }, (error) => showToast(formatError(error))),
  );

  subscriptions.push(
    onSnapshot(
      query(subCollection("messages", code), orderBy("createdAt", "desc"), limit(100)),
      (snapshot) => {
        chatError = "";
        chatMessages = snapshot.docs
          .map((item) => ({ id: item.id, ...item.data() }))
          .reverse();
        render();
      },
      (error) => {
        chatError = formatError(error);
        console.warn("채팅 구독 오류", error);
        render();
      },
    ),
  );

  subscriptions.push(
    onSnapshot(subRef("private", currentUser.uid, code), (snapshot) => {
      myPrivate = snapshot.exists() ? snapshot.data() : null;
      if (myPrivate?.actionDone) actionSubmitting = false;
      render();
    }, (error) => console.warn("개인 역할 구독 오류", error)),
  );

  subscriptions.push(
    onSnapshot(subRef("votes", currentUser.uid, code), (snapshot) => {
      myVote = snapshot.exists() ? snapshot.data() : null;
      render();
    }, (error) => console.warn("내 투표 구독 오류", error)),
  );

  subscriptions.push(
    onSnapshot(subRef("results", "main", code), (snapshot) => {
      publicResult = snapshot.exists() ? snapshot.data() : null;
      render();
    }, (error) => console.warn("결과 구독 오류", error)),
  );

  subscriptions.push(
    onSnapshot(subRef("revealed", "main", code), (snapshot) => {
      revealedResult = snapshot.exists() ? snapshot.data() : null;
      render();
    }, (error) => console.warn("직업 공개 구독 오류", error)),
  );
}

function ensureHostListeners() {
  if (!isHost() || hostListenersActive || !roomCode) return;
  hostListenersActive = true;

  hostSubscriptions.push(
    onSnapshot(subCollection("private"), (snapshot) => {
      hostPrivates = snapshot.docs.map((item) => ({ uid: item.id, ...item.data() }));
      render();
    }, (error) => console.warn("방장 역할 문서 구독 오류", error)),
  );

  hostSubscriptions.push(
    onSnapshot(subCollection("votes"), (snapshot) => {
      hostVotes = snapshot.docs.map((item) => ({ uid: item.id, ...item.data() }));
      render();
    }, (error) => console.warn("방장 투표 구독 오류", error)),
  );

  hostSubscriptions.push(
    onSnapshot(subCollection("actions"), (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const data = change.doc.data();
        if (!data.processed && !processingActions.has(change.doc.id)) {
          processingActions.add(change.doc.id);
          processAction(change.doc.id)
            .catch((error) => console.error("행동 처리 실패", error))
            .finally(() => processingActions.delete(change.doc.id));
        }
      });
    }, (error) => console.warn("행동 구독 오류", error)),
  );
}

async function sendChatMessage(rawText) {
  if (!currentUser || !roomCode || !getPlayer(currentUser.uid)) {
    throw new Error("방에 입장한 뒤 채팅할 수 있습니다.");
  }
  if (isChatLocked()) {
    throw new Error("밤 행동 중에는 채팅을 보낼 수 없습니다.");
  }

  const cleanText = String(rawText ?? "").trim().slice(0, 120);
  if (!cleanText) throw new Error("메시지를 입력해 주세요.");
  if (Date.now() - lastChatSentAt < 700) {
    throw new Error("메시지는 잠시 간격을 두고 보내 주세요.");
  }

  const sender = getPlayer(currentUser.uid);
  const previousDraft = cleanText;
  chatSending = true;
  uiState.chatDraft = "";
  render();

  try {
    await setDoc(doc(subCollection("messages")), {
      senderUid: currentUser.uid,
      senderName: sender.nickname,
      text: cleanText,
      createdAt: serverTimestamp(),
    });
    lastChatSentAt = Date.now();
  } catch (error) {
    uiState.chatDraft = previousDraft;
    throw error;
  } finally {
    chatSending = false;
    render();
  }
}

async function startGame() {
  if (!isHost()) throw new Error("방장만 게임을 시작할 수 있습니다.");
  const orderedPlayers = sortedPlayers();
  const count = orderedPlayers.length;
  const deck = deckForPlayerCount(count);
  if (!deck) throw new Error("게임은 3명부터 9명까지 참여할 수 있습니다.");

  await Promise.all([
    deleteSubcollection("private"),
    deleteSubcollection("actions"),
    deleteSubcollection("votes"),
    deleteSubcollection("secrets"),
    deleteSubcollection("results"),
    deleteSubcollection("revealed"),
  ]);

  const shuffledDeck = shuffle(deck);
  const initialRoles = {};
  const currentRoles = {};
  orderedPlayers.forEach((player, index) => {
    initialRoles[player.uid] = shuffledDeck[index];
    currentRoles[player.uid] = shuffledDeck[index];
  });
  const centerRoles = shuffledDeck.slice(count);

  const batch = writeBatch(db);
  batch.set(subRef("secrets", "main"), {
    initialRoles,
    currentRoles,
    centerRoles,
    createdAt: serverTimestamp(),
  });

  orderedPlayers.forEach((player) => {
    batch.set(subRef("private", player.uid), {
      initialRole: initialRoles[player.uid],
      currentRole: currentRoles[player.uid],
      actionDone: false,
      viewInfo: null,
      lastStep: "werewolf",
    });
  });

  batch.update(roomRef(), {
    status: "night",
    nightIndex: 0,
    nightRole: "werewolf",
    gameNumber: (roomData.gameNumber ?? 0) + 1,
    updatedAt: serverTimestamp(),
  });
  await batch.commit();
  await prepareNightStage("werewolf");
}

async function prepareNightStage(role) {
  if (!isHost()) return;
  const secretSnapshot = await getDoc(subRef("secrets", "main"));
  if (!secretSnapshot.exists()) throw new Error("게임 역할 정보가 없습니다.");
  const secrets = secretSnapshot.data();
  const allUids = Object.keys(secrets.initialRoles);
  const actors = allUids.filter((uid) => secrets.initialRoles[uid] === role);

  const batch = writeBatch(db);
  allUids.forEach((uid) => {
    batch.set(subRef("private", uid), {
      actionDone: false,
      viewInfo: null,
      lastStep: role,
    }, { merge: true });
  });

  if (role === "werewolf") {
    if (actors.length > 1) {
      actors.forEach((uid) => {
        batch.set(subRef("private", uid), {
          actionDone: true,
          viewInfo: {
            kind: "players",
            title: "함께하는 늑대인간",
            playerUids: actors.filter((otherUid) => otherUid !== uid),
          },
        }, { merge: true });
      });
    } else if (actors.length === 1) {
      batch.set(subRef("private", actors[0]), {
        actionDone: false,
        viewInfo: {
          kind: "message",
          title: "혼자 남은 늑대인간",
          text: "다른 늑대인간이 없습니다. 중앙 카드 한 장을 선택해 확인하세요.",
        },
      }, { merge: true });
    }
  }

  if (role === "freemason") {
    actors.forEach((uid) => {
      const others = actors.filter((otherUid) => otherUid !== uid);
      batch.set(subRef("private", uid), {
        actionDone: true,
        viewInfo: others.length
          ? { kind: "players", title: "다른 프리메이슨", playerUids: others }
          : { kind: "message", title: "혼자인 프리메이슨", text: "다른 프리메이슨은 중앙 카드에 있습니다." },
      }, { merge: true });
    });
  }

  await batch.commit();
}

function validateTargetUid(uid, currentRoles, actorUid) {
  return Boolean(uid && uid !== actorUid && Object.hasOwn(currentRoles, uid));
}

async function processAction(actorUid) {
  if (!isHost()) return;
  const actionRef = subRef("actions", actorUid);
  const gameSecretRef = subRef("secrets", "main");
  const actorPrivateRef = subRef("private", actorUid);

  await runTransaction(db, async (transaction) => {
    const [actionSnapshot, roomSnapshot, secretSnapshot, actorPrivateSnapshot] = await Promise.all([
      transaction.get(actionRef),
      transaction.get(roomRef()),
      transaction.get(gameSecretRef),
      transaction.get(actorPrivateRef),
    ]);

    if (!actionSnapshot.exists() || actionSnapshot.data().processed) return;
    if (!roomSnapshot.exists() || roomSnapshot.data().status !== "night") return;
    if (!secretSnapshot.exists() || !actorPrivateSnapshot.exists()) return;

    const action = actionSnapshot.data();
    const activeRole = roomSnapshot.data().nightRole;
    const secrets = secretSnapshot.data();
    const initialRole = secrets.initialRoles?.[actorUid];
    const currentRoles = { ...secrets.currentRoles };

    if (action.step !== activeRole || initialRole !== activeRole) {
      transaction.update(actionRef, {
        processed: true,
        error: "현재 행동 순서와 맞지 않습니다.",
        processedAt: serverTimestamp(),
      });
      return;
    }

    let viewInfo = null;

    if (activeRole === "werewolf") {
      const wolfUids = Object.entries(secrets.initialRoles)
        .filter(([, role]) => role === "werewolf")
        .map(([uid]) => uid);
      const centerIndex = Number(action.payload?.centerIndex);
      if (wolfUids.length !== 1 || ![0, 1, 2].includes(centerIndex)) {
        transaction.update(actionRef, { processed: true, error: "유효하지 않은 선택입니다." });
        return;
      }
      viewInfo = {
        kind: "roles",
        title: "확인한 중앙 카드",
        cards: [{ label: `중앙 카드 ${centerIndex + 1}`, role: secrets.centerRoles[centerIndex] }],
      };
    }

    if (activeRole === "seer") {
      const mode = action.payload?.mode;
      if (mode === "center") {
        const indices = [...new Set(action.payload?.centerIndices ?? [])].map(Number);
        if (indices.length !== 2 || indices.some((index) => ![0, 1, 2].includes(index))) {
          transaction.update(actionRef, { processed: true, error: "중앙 카드 두 장을 선택해야 합니다." });
          return;
        }
        viewInfo = {
          kind: "roles",
          title: "예언자가 확인한 중앙 카드",
          cards: indices.map((index) => ({ label: `중앙 카드 ${index + 1}`, role: secrets.centerRoles[index] })),
        };
      } else {
        const targetUid = action.payload?.targetUid;
        if (!validateTargetUid(targetUid, currentRoles, actorUid)) {
          transaction.update(actionRef, { processed: true, error: "다른 참가자 한 명을 선택해야 합니다." });
          return;
        }
        viewInfo = {
          kind: "roles",
          title: "예언자가 확인한 카드",
          cards: [{ labelUid: targetUid, role: currentRoles[targetUid] }],
        };
      }
    }

    if (activeRole === "robber") {
      const targetUid = action.payload?.targetUid;
      if (!validateTargetUid(targetUid, currentRoles, actorUid)) {
        transaction.update(actionRef, { processed: true, error: "교환할 참가자를 선택해야 합니다." });
        return;
      }
      const actorRole = currentRoles[actorUid];
      const targetRole = currentRoles[targetUid];
      currentRoles[actorUid] = targetRole;
      currentRoles[targetUid] = actorRole;

      transaction.update(gameSecretRef, { currentRoles });
      transaction.update(actorPrivateRef, { currentRole: targetRole });
      transaction.update(subRef("private", targetUid), { currentRole: actorRole });
      viewInfo = {
        kind: "roles",
        title: "강도가 새로 받은 카드",
        cards: [{ label: "현재 내 역할", role: targetRole }],
      };
    }

    if (activeRole === "troublemaker") {
      const targets = [...new Set(action.payload?.targetUids ?? [])];
      if (targets.length !== 2 || targets.some((uid) => !validateTargetUid(uid, currentRoles, actorUid))) {
        transaction.update(actionRef, { processed: true, error: "서로 다른 참가자 두 명을 선택해야 합니다." });
        return;
      }
      const [firstUid, secondUid] = targets;
      const firstRole = currentRoles[firstUid];
      const secondRole = currentRoles[secondUid];
      currentRoles[firstUid] = secondRole;
      currentRoles[secondUid] = firstRole;

      transaction.update(gameSecretRef, { currentRoles });
      transaction.update(subRef("private", firstUid), { currentRole: secondRole });
      transaction.update(subRef("private", secondUid), { currentRole: firstRole });
      viewInfo = {
        kind: "players",
        title: "서로 바꾼 참가자",
        playerUids: targets,
        text: "카드 내용은 확인할 수 없습니다.",
      };
    }

    transaction.update(actorPrivateRef, {
      actionDone: true,
      viewInfo,
    });
    transaction.update(actionRef, {
      processed: true,
      processedAt: serverTimestamp(),
    });
  });
}

async function submitAction(type, payload) {
  if (!currentUser || !roomData?.nightRole || actionSubmitting) return;
  actionSubmitting = true;
  render();
  try {
    await setDoc(subRef("actions", currentUser.uid), {
      step: roomData.nightRole,
      type,
      payload,
      processed: false,
      createdAt: serverTimestamp(),
    });
  } catch (error) {
    actionSubmitting = false;
    render();
    throw error;
  }
}

function currentNightCompletion() {
  if (!isHost() || !roomData?.nightRole || hostPrivates.length !== players.length) {
    return { actors: [], done: 0, total: 0, ready: false };
  }
  const actors = hostPrivates.filter((item) => item.initialRole === roomData.nightRole);
  const done = actors.filter((item) => item.actionDone).length;
  return { actors, done, total: actors.length, ready: done === actors.length };
}

async function advanceNight() {
  if (!isHost()) return;
  const completion = currentNightCompletion();
  if (!completion.ready) throw new Error("아직 행동을 마치지 않은 참가자가 있습니다.");

  const currentIndex = NIGHT_ORDER.indexOf(roomData.nightRole);
  if (currentIndex < NIGHT_ORDER.length - 1) {
    const nextRole = NIGHT_ORDER[currentIndex + 1];
    await updateDoc(roomRef(), {
      nightIndex: currentIndex + 1,
      nightRole: nextRole,
      updatedAt: serverTimestamp(),
    });
    await prepareNightStage(nextRole);
  } else {
    await updateDoc(roomRef(), {
      status: "discussion",
      nightIndex: null,
      nightRole: null,
      updatedAt: serverTimestamp(),
    });
  }
}

async function startVoting() {
  if (!isHost()) return;
  await deleteSubcollection("votes");
  await updateDoc(roomRef(), {
    status: "voting",
    updatedAt: serverTimestamp(),
  });
}

async function castVote(targetUid) {
  if (!currentUser || roomData?.status !== "voting") return;
  if (!targetUid || targetUid === currentUser.uid) throw new Error("자기 자신에게는 투표할 수 없습니다.");
  await setDoc(subRef("votes", currentUser.uid), {
    voterUid: currentUser.uid,
    targetUid,
    createdAt: serverTimestamp(),
  });
  showToast(`${playerName(targetUid)}에게 투표했습니다.`);
}

function calculateOutcome(currentRoles, eliminatedUids) {
  const wolfUids = Object.entries(currentRoles)
    .filter(([, role]) => role === "werewolf")
    .map(([uid]) => uid);
  const deadWolves = eliminatedUids.filter((uid) => currentRoles[uid] === "werewolf");
  const deadTanners = eliminatedUids.filter((uid) => currentRoles[uid] === "tanner");

  return {
    villageWin: deadWolves.length > 0 || (wolfUids.length === 0 && eliminatedUids.length === 0),
    wolfWin: wolfUids.length > 0 && deadWolves.length === 0,
    tannerWin: deadTanners.length > 0,
  };
}

async function publishVoteResult() {
  if (!isHost()) return;
  const voteSnapshot = await getDocs(subCollection("votes"));
  if (voteSnapshot.size !== players.length) throw new Error("모든 참가자가 투표를 마칠 때까지 기다려 주세요.");

  const secretSnapshot = await getDoc(subRef("secrets", "main"));
  if (!secretSnapshot.exists()) throw new Error("게임 역할 정보가 없습니다.");
  const currentRoles = secretSnapshot.data().currentRoles;
  const votes = voteSnapshot.docs.map((item) => item.data());
  const voteCounts = {};
  players.forEach((player) => { voteCounts[player.uid] = 0; });
  votes.forEach((vote) => {
    if (Object.hasOwn(voteCounts, vote.targetUid)) voteCounts[vote.targetUid] += 1;
  });

  const maxVotes = Math.max(...Object.values(voteCounts));
  const eliminatedUids = maxVotes <= 1
    ? []
    : Object.entries(voteCounts).filter(([, count]) => count === maxVotes).map(([uid]) => uid);
  const outcome = calculateOutcome(currentRoles, eliminatedUids);

  const batch = writeBatch(db);
  batch.set(subRef("results", "main"), {
    votes,
    voteCounts,
    maxVotes,
    eliminatedUids,
    ...outcome,
    publishedAt: serverTimestamp(),
  });
  batch.update(roomRef(), {
    status: "results",
    updatedAt: serverTimestamp(),
  });
  await batch.commit();
}

async function revealRoles() {
  if (!isHost()) return;
  const [secretSnapshot, resultSnapshot] = await Promise.all([
    getDoc(subRef("secrets", "main")),
    getDoc(subRef("results", "main")),
  ]);
  if (!secretSnapshot.exists() || !resultSnapshot.exists()) throw new Error("공개할 결과가 없습니다.");

  const secrets = secretSnapshot.data();
  const result = resultSnapshot.data();
  const winnerUids = Object.entries(secrets.currentRoles)
    .filter(([, role]) => {
      if (role === "werewolf") return result.wolfWin;
      if (role === "tanner") return result.tannerWin;
      return result.villageWin;
    })
    .map(([uid]) => uid);

  const batch = writeBatch(db);
  batch.set(subRef("revealed", "main"), {
    initialRoles: secrets.initialRoles,
    finalRoles: secrets.currentRoles,
    centerRoles: secrets.centerRoles,
    winnerUids,
    revealedAt: serverTimestamp(),
  });
  batch.update(roomRef(), {
    status: "reveal",
    updatedAt: serverTimestamp(),
  });
  await batch.commit();
}

async function resetToLobby() {
  if (!isHost()) return;
  await Promise.all([
    deleteSubcollection("private"),
    deleteSubcollection("actions"),
    deleteSubcollection("votes"),
    deleteSubcollection("secrets"),
    deleteSubcollection("results"),
    deleteSubcollection("revealed"),
  ]);
  await updateDoc(roomRef(), {
    status: "lobby",
    nightIndex: null,
    nightRole: null,
    updatedAt: serverTimestamp(),
  });
}

function renderViewInfo(viewInfo) {
  if (!viewInfo) return "";
  let body = "";
  if (viewInfo.kind === "message") {
    body = `<p>${escapeHtml(viewInfo.text)}</p>`;
  }
  if (viewInfo.kind === "players") {
    const names = (viewInfo.playerUids ?? []).map((uid) => escapeHtml(playerName(uid))).join(", ");
    body = `<p><strong>${names || "없음"}</strong></p>${viewInfo.text ? `<p class="muted">${escapeHtml(viewInfo.text)}</p>` : ""}`;
  }
  if (viewInfo.kind === "roles") {
    body = (viewInfo.cards ?? []).map((card) => {
      const info = roleInfo(card.role);
      const label = card.labelUid ? playerName(card.labelUid) : card.label;
      return `<p><strong>${escapeHtml(label)}</strong> · ${info.icon} ${info.name}</p>`;
    }).join("");
  }
  return `
    <div class="action-result">
      <h3>${escapeHtml(viewInfo.title ?? "확인 결과")}</h3>
      ${body}
    </div>
  `;
}

  const isMyTurn = myPrivate.initialRole === activeRole;

        <p style="margin-bottom:0">현재는 ${roleInfo(activeRole).name}의 행동 시간입니다.</p>

  }

  if (myPrivate.actionDone) {
    return `
      <div class="action-box">
        <h3>행동 완료</h3>
        <p>확인한 내용을 기억하고 다른 사람에게 화면을 보여주지 마세요.</p>

    `;
  }

  const pendingText = actionSubmitting ? '<p class="warning-text center">방장이 행동을 처리하고 있습니다.</p>' : "";

  if (activeRole === "werewolf") {
    return `
      <div class="action-box">
        <h3>혼자 남은 늑대인간</h3>
        <p>중앙 카드 한 장을 선택해 확인하세요.</p>

        ${renderCenterOptions({ selected: uiState.selectedCenters, max: 1 })}

        <button class="btn full" data-action="submit-wolf" ${uiState.selectedCenters.length === 1 && !actionSubmitting ? "" : "disabled"}>선택한 카드 확인</button>
        ${pendingText}
      </div>
    `;
  }

  if (activeRole === "seer") {
    const centerMode = uiState.seerMode === "center";
    const ready = centerMode ? uiState.selectedCenters.length === 2 : uiState.selectedPlayers.length === 1;
    return `
      <div class="action-box">
        <h3>예언자의 선택</h3>
        <p>다른 사람 한 명 또는 중앙 카드 두 장을 확인할 수 있습니다.</p>
        <div class="tab-row">
          <button class="tab ${!centerMode ? "active" : ""}" data-action="seer-mode" data-mode="player">다른 사람 1장</button>
          <button class="tab ${centerMode ? "active" : ""}" data-action="seer-mode" data-mode="center">중앙 카드 2장</button>
        </div>
        ${centerMode
          ? renderCenterOptions({ selected: uiState.selectedCenters, max: 2 })
          : renderPlayerOptions({ selected: uiState.selectedPlayers, max: 1 })}
        <div class="spacer"></div>
        <button class="btn full" data-action="submit-seer" ${ready && !actionSubmitting ? "" : "disabled"}>카드 확인</button>
        ${pendingText}
      </div>
    `;
  }

  if (activeRole === "robber") {
    return `
      <div class="action-box">
        <h3>강도의 선택</h3>
        <p>카드를 바꿀 참가자 한 명을 선택하세요.</p>
        ${renderPlayerOptions({ selected: uiState.selectedPlayers, max: 1 })}
        <div class="spacer"></div>
        <button class="btn full" data-action="submit-robber" ${uiState.selectedPlayers.length === 1 && !actionSubmitting ? "" : "disabled"}>카드 바꾸기</button>
        ${pendingText}
      </div>
    `;
  }

  if (activeRole === "troublemaker") {
    return `
      <div class="action-box">
        <h3>말썽쟁이의 선택</h3>
        <p>자신을 제외한 참가자 두 명을 선택하세요.</p>

        <div class="spacer"></div>

        ${pendingText}

  }

  if (activeRole === "freemason") {

        ${renderViewInfo(myPrivate.viewInfo)}

  return '<div class="action-box center"><p>특별한 행동이 없습니다.</p></div>';
}

  const completion = currentNightCompletion();
  const denominator = Math.max(completion.total, 1);
  const percent = completion.total === 0 ? 100 : Math.round((completion.done / denominator) * 100);
  const isLast = roomData.nightRole === NIGHT_ORDER.at(-1);
  return `
    <div class="host-panel">
      <h3>방장 진행판</h3>
      <p>${completion.total === 0 ? "이 역할은 참가자에게 배정되지 않았습니다." : `${completion.done}명 / ${completion.total}명 행동 완료`}</p>
      <div class="progress-line"><div class="progress-fill" style="width:${percent}%"></div></div>
      <button class="btn full" data-action="advance-night" ${completion.ready ? "" : "disabled"}>${isLast ? "토론 시작" : "다음 역할 진행"}</button>

  `;
}

  if (!publicResult) {
    return pageFrame('<section class="card center"><p>투표 결과를 불러오는 중입니다.</p></section>');
  }
  const eliminated = publicResult.eliminatedUids ?? [];
  return pageFrame(`
    <section class="card">
      <div class="status-banner">
        <strong>📊 투표 결과</strong>
        <span>${eliminated.length ? "최다 득표자가 처형되었습니다." : "모든 최다 득표가 1표 이하라 아무도 처형되지 않았습니다."}</span>
      </div>
      <div class="vote-table">
        ${sortedPlayers().map((player) => `
          <div class="vote-row ${eliminated.includes(player.uid) ? "eliminated" : ""}">
            <span>${escapeHtml(player.nickname)} ${eliminated.includes(player.uid) ? "💀" : ""}</span>
            <span class="vote-count">${publicResult.voteCounts?.[player.uid] ?? 0}표</span>
          </div>
        `).join("")}
      </div>
      ${renderTeamResults(publicResult)}
      <div class="action-box">
        <h3>누가 누구에게 투표했나요?</h3>
        ${(publicResult.votes ?? []).map((vote) => `<p>${escapeHtml(playerName(vote.voterUid))} → <strong>${escapeHtml(playerName(vote.targetUid))}</strong></p>`).join("")}
      </div>
      ${isHost() ? `
        <div class="host-panel">
          <button class="btn full" data-action="reveal-roles">직업 공개</button>
        </div>
      ` : '<p class="center muted" style="margin-top:14px">방장이 직업을 공개할 때까지 기다려 주세요.</p>'}
    </section>
  `);
}

function renderReveal() {
  if (!publicResult || !revealedResult) {
    return pageFrame('<section class="card center"><p>직업 정보를 불러오는 중입니다.</p></section>');
  }
  const eliminated = publicResult.eliminatedUids ?? [];
  const winners = revealedResult.winnerUids ?? [];
  return pageFrame(`
    <section class="card">
      <div class="status-banner">
        <strong>🎴 최종 직업 공개</strong>
        <span>밤 사이에 바뀐 카드의 이동을 확인하세요.</span>
      </div>
      ${renderTeamResults(publicResult)}
      <div class="reveal-grid">
        ${sortedPlayers().map((player) => {
          const initial = roleInfo(revealedResult.initialRoles?.[player.uid]);
          const final = roleInfo(revealedResult.finalRoles?.[player.uid]);
          const changed = revealedResult.initialRoles?.[player.uid] !== revealedResult.finalRoles?.[player.uid];
          return `
            <div class="reveal-item ${eliminated.includes(player.uid) ? "eliminated" : ""}">
              <div class="reveal-head">
                <strong>${escapeHtml(player.nickname)} ${eliminated.includes(player.uid) ? "💀" : ""}</strong>
                ${winners.includes(player.uid) ? '<span class="winner-mark">승리</span>' : ""}
              </div>
              <div class="role-change">
                처음: <strong>${initial.icon} ${initial.name}</strong>
                ${changed ? ` → 최종: <strong>${final.icon} ${final.name}</strong>` : ""}
              </div>
            </div>
          `;
        }).join("")}
      </div>
      <div class="divider"></div>
      <h3>중앙 카드</h3>
      <div class="center-cards">
        ${(revealedResult.centerRoles ?? []).map((role, index) => {
          const info = roleInfo(role);
          return `<div class="center-card"><div class="mini-icon">${info.icon}</div><div class="mini-name">${index + 1}. ${info.name}</div></div>`;
        }).join("")}
      </div>
      ${isHost() ? `
        <div class="host-panel">
          <button class="btn success full" data-action="reset-lobby">같은 방에서 새 게임</button>
        </div>
      ` : '<p class="center muted" style="margin-top:14px">방장이 새 게임을 준비할 때까지 기다려 주세요.</p>'}
    </section>
  `);
}

function render() {
  if (!currentUser) return;
  if (!roomCode || !roomData) {
    appEl.innerHTML = renderLanding();
    return;
  }

  const renderers = {
    lobby: renderLobby,
    night: renderNight,
    discussion: renderDiscussion,
    voting: renderVoting,
    results: renderResults,
    reveal: renderReveal,
  };
  const renderer = renderers[roomData.status] ?? renderLobby;
  const newestChatId = chatMessages.at(-1)?.id ?? null;
  const shouldScrollChat = newestChatId !== lastRenderedChatId;
  appEl.innerHTML = renderer();
  if (shouldScrollChat) {
    lastRenderedChatId = newestChatId;
    requestAnimationFrame(() => {
      const chatBox = document.querySelector("#chat-messages");
      if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
    });
  }
}

function toggleSelection(list, value, max) {
  if (list.includes(value)) return list.filter((item) => item !== value);
  if (max === 1) return [value];
  if (list.length >= max) return [...list.slice(1), value];
  return [...list, value];
}

async function safeRun(task) {
  try {
    await task();
  } catch (error) {
    showToast(formatError(error));
  }
}

appEl.addEventListener("submit", (event) => {
  if (event.target.id === "chat-form") {
    event.preventDefault();
    const formData = new FormData(event.target);
    const message = String(formData.get("message") ?? uiState.chatDraft);
    safeRun(() => sendChatMessage(message));
    return;
  }

  if (event.target.id !== "entry-form") return;
  event.preventDefault();
  const formData = new FormData(event.target);
  const mode = event.submitter?.value;
  const nickname = String(formData.get("nickname") ?? "");
  const code = String(formData.get("roomCode") ?? "");
  safeRun(async () => {
    event.submitter.disabled = true;
    if (mode === "create") await createRoom(nickname);
    if (mode === "join") await joinRoom(code, nickname);
  });
});

appEl.addEventListener("input", (event) => {
  if (event.target.id === "chat-input") {
    uiState.chatDraft = event.target.value.slice(0, 120);
  }
});

appEl.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;

  if (action === "copy-code") {
    safeRun(async () => {
      await navigator.clipboard.writeText(roomCode);
      showToast(`방 코드 ${roomCode}를 복사했습니다.`);
    });
    return;
  }

  if (action === "show-role") {
    roleVisible = true;
    render();
    return;
  }
  if (action === "hide-role") {
    roleVisible = false;
    render();
    return;
  }

  if (action === "select-player") {
    const uid = target.dataset.uid;
    const max = Number(target.dataset.max ?? 1);
    uiState.selectedPlayers = toggleSelection(uiState.selectedPlayers, uid, max);
    render();
    return;
  }

  if (action === "select-center") {
    const index = Number(target.dataset.index);
    const max = Number(target.dataset.max ?? 1);
    uiState.selectedCenters = toggleSelection(uiState.selectedCenters, index, max);
    render();
    return;
  }

  if (action === "seer-mode") {
    uiState.seerMode = target.dataset.mode;
    uiState.selectedPlayers = [];
    uiState.selectedCenters = [];
    render();
    return;
  }

  if (action === "select-vote") {
    uiState.voteTarget = target.dataset.uid;
    render();
    return;
  }

  const asyncActions = {
    "leave-room": leaveRoom,
    "start-game": startGame,
    "advance-night": advanceNight,
    "start-voting": startVoting,
    "publish-result": publishVoteResult,
    "reveal-roles": revealRoles,
    "reset-lobby": resetToLobby,
    "cast-vote": () => castVote(uiState.voteTarget),
    "submit-wolf": () => submitAction("wolf-center", { centerIndex: uiState.selectedCenters[0] }),
    "submit-seer": () => submitAction("seer-view", uiState.seerMode === "center"
      ? { mode: "center", centerIndices: uiState.selectedCenters }
      : { mode: "player", targetUid: uiState.selectedPlayers[0] }),
    "submit-robber": () => submitAction("robber-swap", { targetUid: uiState.selectedPlayers[0] }),
    "submit-troublemaker": () => submitAction("troublemaker-swap", { targetUids: uiState.selectedPlayers }),
  };

  if (asyncActions[action]) safeRun(asyncActions[action]);
});

  </script>
</body>
</html>
